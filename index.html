<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Line Logistics</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f9}
nav{background:#000;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
nav a{color:#fff;text-decoration:none;margin-left:15px}
.menu{display:flex}
.hamburger{display:none;font-size:26px;cursor:pointer}

header{
background:url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7') center/cover no-repeat;
padding:120px 20px;
color:white;
text-align:center
}

section{background:white;margin:20px;padding:30px;border-radius:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}

.card{
background:#f9f9f9;
padding:20px;
border-radius:10px;
text-align:center
}

img{width:100%;border-radius:10px}

.contact input,.contact textarea{
width:100%;padding:10px;margin:8px 0
}

footer{background:#000;color:white;padding:25px;text-align:center}

@media(max-width:768px){
.menu{display:none;flex-direction:column;background:#000;position:absolute;top:60px;right:0;width:200px}
.menu a{padding:10px}
.hamburger{display:block}
}
</style>

<script>
function toggleMenu(){
document.getElementById("menu").classList.toggle("show");
}
</script>

</head>
<body>

<nav>
<b>City Line Logistics</b>
<div class="hamburger" onclick="toggleMenu()">☰</div>
<div class="menu" id="menu">
<a href="#services">Services</a>
<a href="#fleet">Fleet</a>
<a href="#gallery">Gallery</a>
<a href="#contact">Contact</a>
</div>
</nav>

<header>
<h1>Fast & Reliable Logistics</h1>
<p>Ahmedabad | 24x7 Transport Service</p>
</header>

<section id="services">
<h2>Our Services</h2>
<div class="grid">
<div class="card">Local Transport</div>
<div class="card">Intercity Delivery</div>
<div class="card">Truck Services</div>
<div class="card">Warehouse Logistics</div>
</div>
</section>

<section id="fleet">
<h2>Our Fleet</h2>
<div class="grid">
<img src="https://images.unsplash.com/photo-1595433707802-5c6a41e89c39">
<img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957">
<img src="https://images.unsplash.com/photo-1619642751463-2d6ec6d2c36d">
</div>
</section>

<section id="gallery">
<h2>Work Gallery</h2>
<div class="grid">
<img src="https://images.unsplash.com/photo-1529070538774-1843cb3265df">
<img src="https://images.unsplash.com/photo-1592833159058-38c8e2b7b1b5">
<img src="https://images.unsplash.com/photo-1517677208171-0bc6725a3e60">
</div>
</section>

<section id="contact" class="contact">
<h2>Contact Us</h2>
<input placeholder="Your Name">
<input placeholder="Phone Number">
<textarea placeholder="Message"></textarea>
<button>Send Message</button>

<iframe 
src="https://maps.google.com/maps?q=Ahmedabad&t=&z=13&ie=UTF8&iwloc=&output=embed"
width="100%" height="250" style="border:0;margin-top:15px"></iframe>
</section>

<footer>
City Line Logistics © 2025
</footer>

</body>
</html>
